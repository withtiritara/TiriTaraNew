        function escHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function nl2p(str) {
            if (!str) return '';
            return str.split('\n\n').map(p => `<p style="margin:0 0 0.85rem 0;">${p.replace(/\n/g, '<br>')}</p>`).join('');
        }

        function renderDetail(key) {
            const data = journeyData[key];
            if (!data) {
                window.location.href = 'all-trips.html';
                return;
            }

            document.title = `${data.title} - Tiri Tara`;
            document.getElementById('page-title').textContent = `${data.title} - Tiri Tara`;


            // Build badge HTML
            const badgeHtml = data.badge
                ? `<span class="detail-badge ${data.badgeClass || ''}">${escHtml(data.badge)}</span>`
                : '';

            // Build fields
            const fields = [];

            if (data.tagline) fields.push({ label: 'Tagline', value: escHtml(data.tagline), cls: 'tagline-value' });

            // Dates: support both startDate/endDate and simple dates
            if (data.startDate) fields.push({ label: 'Start date', value: escHtml(data.startDate) });
            if (data.endDate) fields.push({ label: 'End date', value: escHtml(data.endDate) });
            if (data.dates && !data.startDate) fields.push({ label: 'Dates', value: escHtml(data.dates) });
            if (data.duration && !data.endDate) fields.push({ label: 'Duration', value: escHtml(data.duration) });
            if (data.groupSize) fields.push({ label: 'Group size', value: escHtml(data.groupSize) });
            if (data.whatMakesThisTrip) fields.push({ label: 'What makes this trip', value: nl2p(data.whatMakesThisTrip), raw: true });
            if (data.whatToExpect) fields.push({ label: 'What to expect', value: nl2p(data.whatToExpect), raw: true });
            if (data.itineraryHint) fields.push({ label: 'Itinerary hint', value: nl2p(data.itineraryHint), raw: true });
            if (data.covered) fields.push({ label: "What's covered", value: escHtml(data.covered) });
            if (data.price) fields.push({ label: 'Price', value: escHtml(data.price).replace(/\n/g, '<br>'), cls: 'price-value', raw: true });

            // For completed trips, show what made it special and what we did
            if (data.status === 'completed') {
                if (data.whatMadeThisTrip) fields.push({ label: 'What made this trip special', value: nl2p(data.whatMadeThisTrip), raw: true });
                if (data.whatWeDid) fields.push({ label: 'What we did', value: nl2p(data.whatWeDid), raw: true });
            }

            const tableRows = fields.map(f => `
                <div class="detail-row">
                    <div class="detail-label">${f.label}</div>
                    <div class="detail-value ${f.cls || ''}">${f.raw ? f.value : f.value}</div>
                </div>
            `).join('');

            const waMsg = encodeURIComponent(data.whatsappMsg || `Hi, Don't go to ${data.title} without me!`);
            const inviteLabel = data.status === 'completed' ? "Let's go again →" : "Request invite →";

            document.getElementById('detail-container').innerHTML = `
                <div class="detail-header">
                    <h1 class="detail-title">${escHtml(data.title)}</h1>
                    <div class="detail-cta">
                        <a href="https://wa.me/918143120853?text=${waMsg}" class="btn-invite-detail" target="_blank" rel="noopener">${inviteLabel}</a>
                    </div>
                </div>
                <div class="detail-table">
                    ${tableRows}
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            const dest = (params.get('destination') || '').toLowerCase();
            if (dest && journeyData[dest]) {
                renderDetail(dest);
            } else {
                window.location.href = 'all-trips.html';
            }
        });

        function openJoinForm(event) {
            if (event) event.preventDefault();
            const popup = document.getElementById('joinFormPopup');
            if (popup) {
                popup.style.display = 'flex';
                popup.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
                popup.addEventListener('click', function (e) {
                    if (e.target === popup) closeJoinForm();
                });
            }
        }

        function closeJoinForm() {
            const popup = document.getElementById('joinFormPopup');
            if (popup) {
                popup.style.display = 'none';
                popup.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = 'auto';
            }
        }
    </script>
